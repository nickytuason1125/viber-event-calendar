services:
  - type: web
    name: viber-event-calendar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: FEED_TOKEN
        generateValue: true
      - key: DB_PATH
        value: /tmp/events.db
